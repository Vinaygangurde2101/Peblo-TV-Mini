version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peblo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peblo_admin} -d ${POSTGRES_DB:-peblo_tv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-peblo_admin}:${POSTGRES_PASSWORD:-peblo_secret_pass}@postgres:5432/${POSTGRES_DB:-peblo_tv_db}
      - SECRET_KEY=${SECRET_KEY:-super-secret-development-key-change-in-production-32-chars-min}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_PATH=/app/storage
      - CATALOGUE_PATH=/app/storage/catalogue.json
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: peblo_cms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: peblo_viewer
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
